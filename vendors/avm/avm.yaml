# AVM FRITZ!Box (TR-098 / InternetGatewayDevice.*) vendor support.
#
# AVM's CWMP data model is IGD, so everything here is IGD. The USP agent
# IS present and running on 256.08.25 — it is already enrolled with AVM's
# own controller (X_AVM-DE_USPController.1.EndpointID reads
# "pen:872:myfritz-usp") — but it speaks TR-181 over TR-369, not over
# CWMP. See usp-controller.yaml for enrolling Herder as a second
# controller. An earlier note here claimed USP was compiled out, on the
# strength of a diagnostic dump saying "502 Command usp not implemented";
# that was the aicmd debug CLI missing, not the agent.
#
# Everything in this directory was written against a full schema walk of
# a 7530 AX on 256.08.25 (2116 parameters, not truncated). Every instance
# number here is only valid for that firmware — re-run
# POST /api/v1/schema/discover after a firmware change and re-check.
#
# Selector note: productClass is the generic string "FRITZ!Box" across
# every AVM model, so it is useless for scoping — we key on the AVM OUI
# 00040E instead. Model-specific documents (compliance) add
# `model In [...]` with the exact ModelName strings.
#
# KNOWN LIMITS, so they are not rediscovered:
#
#   Per-client WiFi signal has no CWMP path. AssociatedDevice.{i} carries
#   only MacAddress, IPAddress and AuthenticationState — no RSSI, rate or
#   band. The box has the data (a diagnostic dump shows rssi = -56,
#   rate_active_tx and channel_width per station); it is simply not in
#   the TR-069 model. It needs TR-369
#   (Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.SignalStrength), so
#   it arrives with the USP work. The wifi-experience skill's per-client
#   telemetry stays dark on CWMP until then.
#
#   No memory or CPU parameters exist at all. Zero hits for MemoryStatus,
#   ProcessStatus or CPUUsage across the whole survey, and no X_AVM-DE_
#   equivalent. The three baseline rejects on DeviceInfo.MemoryStatus.*
#   and ProcessStatus.CPUUsage are permanent and correctly absorbed by
#   the negative cache — one wasted GPV per device per firmware.
#
#   The negative cache is keyed per firmware, not per configuration. A
#   box switched between IPoE and PPPoE keeps the other family's paths
#   suppressed even once they exist, and there is no flush endpoint.
#
#   DSL telemetry is not shipped. The 12 WANDSLInterfaceConfig paths were
#   written from the model rather than from a DSL-connected box, and on
#   the Ethernet-WAN units here the object reports Status=Disabled with
#   all-zero rates and margins — 12 zeroed series that read as a line at
#   0 dB margin. Re-add once a DSL FRITZ!Box is in the fleet to verify
#   against.

# ---------------------------------------------------------------------------
# interfaces-avm: baseline interfaces-tr098, with the WAN address/uptime
# resolved across both connection families instead of pinned to one.
#
# The baseline pins WANIPConnection; the first version of this file
# pinned WANPPPConnection, on the assumption that a FRITZ!Box is always
# PPPoE. Both are wrong, because AVM instantiates only the family the box
# is configured for, and this fleet runs both PPPoE and IPoE. A pinned
# table resolves to nothing on the other half of the fleet: the WAN group
# on the device page renders blank and the remote-access module's link
# (which reads wan.ip_address) breaks.
#
# The two WAN canonicals are therefore computed entries. Everything else
# (LAN ports wildcarded, WAN L1 status/type/counters) is identical to
# interfaces-tr098.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: interfaces-avm
spec:
  mappings:
    - canonical: canonical.interface.lan.{i}.status
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Status
    - canonical: canonical.interface.lan.{i}.enable
      valueType: boolean
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Enable
    - canonical: canonical.interface.lan.{i}.mac
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.MACAddress
    - canonical: canonical.interface.lan.{i}.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesSent
    - canonical: canonical.interface.lan.{i}.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesReceived
    - canonical: canonical.interface.wan.status
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.PhysicalLinkStatus
    - canonical: canonical.interface.wan.type
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.WANAccessType
    - canonical: canonical.interface.wan.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesSent
    - canonical: canonical.interface.wan.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesReceived
    # WAN address/uptime, on whichever connection family the box is
    # actually using. Computed rather than aliased because an
    # instanceAlias names one family in its `object`, and a FRITZ!Box
    # instantiates only the family in use — see wan-active-ip.ts for the
    # measurements and for why the discriminator is the NumberOfEntries
    # counter rather than ConnectionStatus.
    - canonical: canonical.interface.wan.ip_address
      type: computed
      valueType: string
      computation:
        script: vendors/avm/wan-active-ip.ts
        inputs:
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnectionNumberOfEntries
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnectionNumberOfEntries
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.*
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection.*
        output: canonical.interface.wan.ip_address
    - canonical: canonical.interface.wan.uptime
      type: computed
      valueType: unsignedint
      computation:
        script: vendors/avm/wan-active-uptime.ts
        inputs:
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnectionNumberOfEntries
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnectionNumberOfEntries
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.*
          - InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANPPPConnection.*
        output: canonical.interface.wan.uptime

---
# The mapping profile. Priority 50 beats baseline-tr098 (10).
#
# Binding is single-winner: the winning profile's table list is the
# device's ENTIRE mapping vocabulary. So the whole baseline-tr098 list is
# restated here. Drop any of these and the FRITZ!Box loses that
# vocabulary — omit mgmt-tr098 and it has no connection_request_url and
# becomes undispatchable. Keep this list in step with
# baseline/tr098/mappings.yaml (baseline-tr098).
#
# Five tables are swapped for AVM versions, each in its own file beside
# this one, and each for a different reason:
#
#   interfaces-avm      WAN address/uptime across both connection families
#   netdiag-avm         traceroute and DNS live under X_AVM-DE_DiagnosticTools
#   voice-avm           line 2 is VoiceProfile.2.Line.1, not Line.2
#   remote-access-avm   adds the User.1 account behind RemoteAccess
#   nat-avm             PortMapping follows the live connection family
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: avm-fritzbox-tr098
spec:
  priority: 50
  deviceSelector:
    matchLabels:
      oui: "00040E"
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
      - key: "protocol:cwmp"
        operator: Exists
  parameterMappings:
    - device-info-tr098
    - mgmt-tr098
    - diagnostics-tr098
    - netdiag-avm
    - remote-access-avm
    - wifi-tr098
    - wifi-bssid-tr098
    - wifi-capability-tr098
    - interfaces-avm
    - posture-avm
    - wan-shaping-avm
    - voice-avm
    - nat-avm

---
# WAN telemetry the baseline tr098-wan cannot see: AVM shaping rates and
# the WAN-access-switch state. All interval 0 (passive, rides the sessions
# that already happen). Never a SET, never a passphrase.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: avm-fritzbox-wan
spec:
  priority: 50
  deviceSelector:
    matchLabels:
      oui: "00040E"
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.X_AVM-DE_UpstreamCurrentMaxSpeed"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.X_AVM-DE_DownstreamCurrentMaxSpeed"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.X_AVM-DE_UpstreamShapedRate"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.X_AVM-DE_DownstreamShapedRate"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.X_AVM-DE_WANAccessSwitchState"
      interval: 0
    # Both families, wildcarded. These two leaves exist on WANIPConnection
    # and WANPPPConnection alike (confirmed in the FRITZ!OS 8.24 model and
    # in the 2116-parameter survey), and the family the box is not using
    # has no instances, so it resolves to nothing and faults nothing. The
    # previous version named WANPPPConnection.1 outright, which is where
    # two of the five cwmp:9005 rejections came from on an IPoE box.
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.{i}.WANIPConnection.{i}.LastConnectionError"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.{i}.WANIPConnection.{i}.X_AVM-DE_Stackmode"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.{i}.WANPPPConnection.{i}.LastConnectionError"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.{i}.WANPPPConnection.{i}.X_AVM-DE_Stackmode"
      interval: 0
    # The contracted rate and its read-back, so the device page and any
    # plan-compliance query can see both. kbit/s; see wan-shaping.yaml.
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.Layer1DownstreamMaxBitRate"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.Layer1UpstreamMaxBitRate"
      interval: 0
    # X_AVM-DE_{Down,Up}streamCurrentUtilization is deliberately NOT
    # collected: it is a COMMA-SEPARATED LIST of 5-second samples, not a
    # scalar, so it stores as a string and charts as nothing. The
    # CurrentMaxSpeed pair above is the scalar throughput reading — and
    # note it is in BYTES/s, unlike everything else here, which is
    # kbit/s.

---
# The FRITZ!OS update posture, in the operator namespace.
#
# These are the leaves that decide whether a firmware campaign can land
# on a box, and the device page wants them in a group. A DeviceProfile
# form field must name a canonical — a raw `path:` is rejected at load —
# and no reserved or baseline canonical covers a vendor's update
# posture, so they get operator names. canonical.operator.* is free for
# exactly this and carries no platform semantics.
#
# Collected by avm-fritzbox-system below, rendered by the FRITZ!OS group
# in device-profile.yaml. Keep the three in step.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: posture-avm
spec:
  mappings:
    - canonical: canonical.operator.avm.firmware_subversion
      valueType: string
      devicePath: InternetGatewayDevice.DeviceInfo.AdditionalSoftwareVersion
    - canonical: canonical.operator.avm.upgrade_available
      valueType: boolean
      devicePath: InternetGatewayDevice.UserInterface.UpgradeAvailable
    - canonical: canonical.operator.avm.auto_update
      valueType: string
      devicePath: InternetGatewayDevice.UserInterface.X_AVM-DE_AutoUpdate
    - canonical: canonical.operator.avm.maintenance_window_enabled
      valueType: boolean
      devicePath: InternetGatewayDevice.UserInterface.X_AVM-DE_MaintenanceWindow.Enabled
    - canonical: canonical.operator.avm.maintenance_window_start
      valueType: string
      devicePath: InternetGatewayDevice.UserInterface.X_AVM-DE_MaintenanceWindow.Start
    - canonical: canonical.operator.avm.tr069_firmware_download
      valueType: boolean
      devicePath: InternetGatewayDevice.ManagementServer.X_AVM-DE_TR069FirmwareDownloadEnabled
    - canonical: canonical.operator.avm.unsupported_modifications
      valueType: string
      devicePath: InternetGatewayDevice.DeviceInfo.X_AVM-DE_VendorUnsupportedModifications

---
# System posture: per-port link state, firmware/maintenance/auto-update
# and the connection-request settings we manage in connection-request.ts,
# so their live values are visible on the device. Usernames only, never a
# password (a collected password is a password in telemetry history).
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: avm-fritzbox-system
spec:
  priority: 50
  deviceSelector:
    matchLabels:
      oui: "00040E"
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.{i}.Name"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.{i}.Linkstate"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.{i}.Speed"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.1.X_AVM-DE_EthPort.{i}.Portmode"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.AdditionalSoftwareVersion"
      interval: 3600
    - path: "InternetGatewayDevice.DeviceInfo.X_AVM-DE_VendorUnsupportedModifications"
      interval: 3600
    - path: "InternetGatewayDevice.UserInterface.UpgradeAvailable"
      interval: 3600
    - path: "InternetGatewayDevice.UserInterface.X_AVM-DE_AutoUpdate"
      interval: 3600
    - path: "InternetGatewayDevice.UserInterface.X_AVM-DE_MaintenanceWindow.Enabled"
      interval: 3600
    - path: "InternetGatewayDevice.UserInterface.X_AVM-DE_MaintenanceWindow.Start"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.UpgradesManaged"
      interval: 3600
    # The Management group on the device page renders
    # canonical.mgmt.periodic_inform_interval, and nothing was re-reading
    # it: the stored value was still the 0 from the very first Inform,
    # hours after provisioning had set a real interval. Same reason the
    # neighbouring ManagementServer settings are here — so their live
    # values are visible on the device rather than their bootstrap ones.
    - path: "InternetGatewayDevice.ManagementServer.PeriodicInformEnable"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.PeriodicInformInterval"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.X_AVM-DE_TR069FirmwareDownloadEnabled"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.X_AVM-DE_ConnectionRequestEnable"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.X_AVM-DE_ConnectionRequestSecurityEnable"
      interval: 3600
    - path: "InternetGatewayDevice.ManagementServer.X_AVM-DE_ConnectionRequestIPNetList"
      interval: 3600
    - path: "InternetGatewayDevice.Time.Status"
      interval: 3600
